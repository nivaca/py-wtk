#
# The Flatpak of py-wtk. Build it with tools/bundle-flatpak.py, which puts
# the program (as in the zip, with COMMIT) in build/flatpak/src first, and
# makes dist/py-wtk-v.VERSION-x86_64.flatpak.
#
# The runtime's Python has no Tk, so Tcl/Tk are built here, and Python's
# _tkinter module and tkinter package against the runtime's own Python
# (its exact version, so the module fits it).

app-id: io.github.nivaca.PyWtk
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: py-wtk-gui
finish-args:
  - --share=network     # (it reads en.wiktionary.org)
  - --share=ipc
  - --socket=x11        # (Tk draws through X11; XWayland on Wayland)
cleanup:
  - /bin/tclsh*
  - /bin/wish*
  - /bin/sqlite3_analyzer
  - /include
  - /lib/pkgconfig
  - /lib/*.a
  - /man
  - /share/man
  - /lib/tclConfig.sh
  - /lib/tkConfig.sh
  - /lib/tclooConfig.sh

modules:
  - name: tcl
    subdir: unix
    config-opts:
      - --enable-threads
    post-install:
      - chmod u+w /app/lib/libtcl*.so
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/tcl/Tcl/8.6.16/tcl8.6.16-src.tar.gz
        sha256: 91cb8fa61771c63c262efb553059b7c7ad6757afa5857af6265e4b0bdc2a14a5

  - name: tk
    subdir: unix
    config-opts:
      - --with-tcl=/app/lib
      - --enable-xft
    post-install:
      - chmod u+w /app/lib/libtk*.so
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/tcl/Tcl/8.6.16/tk8.6.16-src.tar.gz
        sha256: be9f94d3575d4b3099d84bc3c10de8994df2d7aa405208173c709cc404a7e5fe

  - name: tkinter
    buildsystem: simple
    build-commands:
      - test "$(python3 -c 'import platform; print(platform.python_version())')" = 3.14.9
      - mkdir -p /app/lib/python3.14/site-packages
      # (_tkinter.c uses CPython's internal headers, which the SDK does not
      # ship: those of the same sources, which the test above makes sure of)
      - gcc -shared -fPIC -O2 -DWITH_APPINIT=1 -DPy_BUILD_CORE_MODULE
        $(python3-config --includes) -IInclude/internal -I/app/include
        -IModules Modules/_tkinter.c Modules/tkappinit.c
        -L/app/lib -ltk8.6 -ltcl8.6 -lX11
        -o /app/lib/python3.14/site-packages/_tkinter$(python3-config --extension-suffix)
      - cp -r Lib/tkinter /app/lib/python3.14/site-packages/
      - rm -rf /app/lib/python3.14/site-packages/tkinter/test
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.14.9/Python-3.14.9.tar.xz
        sha256: e02d9ac21cebda6e46435369744a92c65cc7cd8669697694122cf97ffacd1e53

  - name: py-wtk
    buildsystem: simple
    build-commands:
      # The program: the three launchers, the pywtk package, the icons (the
      # window reads them) and COMMIT; /app/bin has links to the launchers,
      # which find pywtk next to their real path.
      - install -d /app/share/py-wtk/pywtk /app/bin
      - install -m 0755 py-wtk py-wtk-tui py-wtk-gui /app/share/py-wtk/
      - install -m 0644 pywtk/*.py /app/share/py-wtk/pywtk/
      - install -m 0644 COMMIT /app/share/py-wtk/
      - cp -r icons /app/share/py-wtk/
      - python3 -m compileall -q /app/share/py-wtk/pywtk
      - for f in py-wtk py-wtk-tui py-wtk-gui; do ln -s ../share/py-wtk/$f /app/bin/$f; done
      # The menu entries and the icons, named after the app ID, as Flatpak
      # exports them
      - install -d /app/share/applications
      - sed 's/^Icon=py-wtk$/Icon=io.github.nivaca.PyWtk/' packaging/py-wtk.desktop
        > /app/share/applications/io.github.nivaca.PyWtk.desktop
      - sed 's/^Icon=py-wtk$/Icon=io.github.nivaca.PyWtk/' packaging/py-wtk.tui.desktop
        > /app/share/applications/io.github.nivaca.PyWtk.tui.desktop
      - sed 's/^Icon=py-wtk$/Icon=io.github.nivaca.PyWtk/' packaging/py-wtk.cli.desktop
        > /app/share/applications/io.github.nivaca.PyWtk.cli.desktop
      - for d in icons/linux/hicolor/*/apps; do size=$(basename $(dirname $d));
        for f in $d/py-wtk.*; do install -Dm 0644 $f
        /app/share/icons/hicolor/$size/apps/io.github.nivaca.PyWtk.${f##*.}; done; done
      - install -Dm 0644 packaging/flatpak/io.github.nivaca.PyWtk.metainfo.xml
        /app/share/metainfo/io.github.nivaca.PyWtk.metainfo.xml
    sources:
      - type: dir
        path: ../../build/flatpak/src
